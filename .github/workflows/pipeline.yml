name: CI
on:
  push:
  pull_request:
env:
  PYTHON_VERSION: "3.12"
  APP_ENV: staging
jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version ermitteln
        id: version
        run: echo "version=1.0.${{ github.run_number }}" >>
          "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Konfiguration anzeigen
        run: echo "Python ${{ env.PYTHON_VERSION }} in ${{ env.APP_ENV}}" 
      - name: Lauf-Informationen anzeigen
        run: |
              echo "Repository: ${{ github.repository }}"
              echo "Branch: ${{ github.ref_name }}"
              echo "Event: ${{ github.event_name }}"
              echo "Runner: ${{ runner.os }}"   
      - name: Dependencies installieren
        run: python -m pip install -r requirements.txt
      - name: Tests ausführen
        run: python -m pytest -v
      - name: Paket bauen
        run: |
          mkdir -p build
          python -m zipfile -c build/app.zip src/
      - name: Paket hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-paket
          path: build/
      - name: Deploy vorbereiten
        run: echo "Deploy startet"
  deploy:
      runs-on: ubuntu-latest
      needs: test
      if: github.ref == 'refs/heads/main'
      steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-paket
          path: build/
      - run: echo "Deploying Version ${{ needs.test.outputs.version }}"
      - name: Deployment-Platzhalter
        run: echo "Deployment läuft"