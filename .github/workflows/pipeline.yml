name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read    
env:
  PYTHON_VERSION: "3.12"
  APP_ENV: "staging"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version ermitteln
        id: version
        run: echo "version=1.0.${{ github.run_number }}" >>
          "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependencies installieren
        run: python -m pip install -r requirements.txt
      - name: Konfiguration anzeigen
        run: echo "Python ${{ env.PYTHON_VERSION }} in ${{ env.APP_ENV}}" 
      - name: Lauf-Informationen anzeigen
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Runner: $RUNNER_OS"
      - name: Tests ausführen
        run: python -m pytest -v    
      - name: Pip-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-
      - name: Paket bauen
        run: |
          mkdir -p build
          python -m zipfile -c build/app.zip src/
      - name: Paket hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-paket
          path: build/app.zip
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
  
    permissions:
      contents: write
      actions: read

    steps:
      - name: Paket herunterladen
        uses: actions/download-artifact@v4
        with:
          name: app-paket
          path: build/
      - name: Zugansdaten prüfen
        env: 
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN}}
        run: |
          echo "Token-Länge: ${#DEPLOY_TOKEN}"
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Version 1.0.${{ github.run_number }}" \
            --notes "Automatisches Deployment aus GitHub Actions" \
            build/app.zip
