name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  PYTHON_VERSION: "3.12"
  APP_ENV: staging
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version ermitteln
        id: version
        run: echo "version=1.0.${{ github.run_number }}" >>
          "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Konfiguration anzeigen
        run: echo "Python ${{ env.PYTHON_VERSION }} in ${{ env.APP_ENV}}" 
      - name: Lauf-Informationen anzeigen
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Runner: $RUNNER_OS"
      - name: Pip-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-
      - name: Dependencies installieren
        run: python -m pip install -r requirements.txt
      - name: Tests ausführen
        run: python -m pytest -v
      - name: Paket bauen
        run: |
          mkdir -p build
          python -m zipfile -c build/app.zip src/ \
          -x '*/__pycache__/*' '*.pyc' '*.pyo'
      - name: Paket hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-paket
          path: build/app.zip
          if-no-files-found: error
          retention-days: 7
  deploy:
      runs-on: ubuntu-latest
      needs: test
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-paket
          path: build/
      - run: echo "Deploying Version ${{ needs.test.outputs.version }}"
      - name: Deployment-Platzhalter
        run: echo "Deployment läuft"
